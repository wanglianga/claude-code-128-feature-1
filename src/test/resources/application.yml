server:
  port: 0

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://127.0.0.1:5433/dentallab_test}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

app:
  token-ttl-hours: 12
